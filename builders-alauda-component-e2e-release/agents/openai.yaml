interface:
  display_name: "Alauda Component E2E Release"
  short_description: "Release Alauda components with e2e and readiness gates"
  default_prompt: "Use $builders-alauda-component-e2e-release to update an Alauda component, inspect its features and dependencies, ask for the product documentation repo or local directory when release docs are needed, add or reuse smoke, compatibility, performance, and HA e2e tests, add buildkitd-backed image build and local ACP artifact packaging support, call $builders-alauda-security-scan to run image-security-scanner image scans over the required inventory (Cluster Plugin values.yaml images, or OLM/Helm operator operator image, bundle image, and related runtime images), DB CVE scans only when metadata covers that inventory, L5 dynamic security scans, and Helm/Kubernetes/OLM manifest scans, fix required CVEs by updating Dockerfiles or image dependency inputs, check Helm charts, Kubernetes manifests, and OLM bundles for PSA, non-root, privilege, secret, and RBAC security issues, rebuild and push the affected component and e2e images through the configured buildkitd server before e2e, handle security fix gates, update product documentation, prepare CVE database and ERRATA evidence, upload it to ACP, install it on a dev cluster, run e2e tests with the rebuilt images and remediated manifests, document compatibility, and create a PR or MR."
